seed: 2026
deterministic: false
experiment:
  name: e2_resnet50_label_smoothing
  id: E2
  group: ablation
  mandatory: false
  reference: p1_resnet50
  changed_factor: train.label_smoothing 0.0 -> 0.1
  hypothesis: Label smoothing improves test macro-F1 by >= 0.5 pp and lowers ECE,
    because train labels are noisy while test labels are clean.
  decision_criterion: Decision rule of proposal section 4, plus lower mean test ECE
    over 3 seeds.
data:
  image_root: /kaggle/input/datasets/benjaminphc/food-101-256/food-101-256
  raw_root: data/raw/food-101
  split_dir: data/splits
  index_file: data/meta/image_index.csv.gz
  split_seed: 42
  val_fraction: 0.1
  max_hamming: 4
  image_size: 224
  resize: 256
  normalization: imagenet
  train_fraction: 1.0
  subset_seed: 42
  num_workers: 48
  augment:
    crop_scale:
    - 0.35
    - 1.0
    hflip: true
    color_jitter: 0.1
  name: food101
train:
  epochs: 10
  batch_size: 64
  eval_batch_size: 128
  label_smoothing: 0.1
  grad_clip: 1.0
  amp: true
  early_stopping_patience: 4
  checkpoint_metric: val_macro_f1
  max_hours: 10.5
  max_steps_per_epoch: 0
  show_progress: false
optim:
  name: adamw
  lr: 0.001
  backbone_lr: 0.0001
  weight_decay: 0.05
  momentum: 0.9
scheduler:
  name: cosine
  warmup_epochs: 1
  min_lr_ratio: 0.01
eval:
  amp: true
  bootstrap_samples: 1000
  ece_bins: 15
  n_examples: 25
  inference:
    batch_size: 128
    warmup_iters: 10
    timed_iters: 30
    latency_samples: 200
    amp: true
output:
  root: outputs/runs
model:
  name: resnet50
  pretrained: true
run:
  run_id: food101-e2_resnet50_label_smoothing-s2026-20261111-091106
  config_file: /kaggle/working/CO3113-A2/configs/food101/ablations/e2_resnet50_label_smoothing.yaml
  overrides:
  - data.image_root=/kaggle/input/datasets/benjaminphc/food-101-256/food-101-256
  - data.num_workers=48
  - train.show_progress=false
  - train.max_hours=10.50
  started_at: 2026-11-11T09:11:06+0000
