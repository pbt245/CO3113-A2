# E3 - data efficiency: p1_resnet50 trained on 10 % of the train split [OPTIONAL, 1 seed]
base: ../_base.yaml

experiment:
  name: e3_p1_resnet50_frac10
  id: E3
  group: ablation
  mandatory: false
  reference: p1_resnet50
  changed_factor: "data.train_fraction 1.0 -> 0.1 (stratified per class, subset_seed 42)"
  hypothesis: >-
    Pretrained models are far more data-efficient: with 10 % of the train data P1 keeps >= 85 % of
    its full-data macro-F1, B0 does not.
  decision_criterion: "ratio of test macro-F1 to the full-data reference (seed 42)."

model:
  name: resnet50
  pretrained: true

data:
  train_fraction: 0.1
